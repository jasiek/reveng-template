# GigaDevice GD32F303xx — the usual main MCU in AnyTone/mid-range DMR handhelds.
#
# NOT a genuine ST STM32F103, despite being drop-in compatible:
#   * Cortex-M4 core (OpenOCD reports "Cortex-M4 r0p1"), not M3
#   * DAP IDCODE 0x2ba01477 (DPv2). ST's F103 is 0x1ba01477 (DPv1), so the stock
#     target/stm32f1x.cfg rejects it with "UNEXPECTED idcode" — overridden below.
#   * Keeps the F1 memory map (flash @0x08000000, flash-size reg @0x1FFFF7E0,
#     option bytes @0x1FFFF800), so the stm32f1x flash driver still works.
#
# Attach passively — see the note at the top of probe.sh for why NRST must not
# be driven and why the radio has to be in firmware-update mode first.

source [find interface/stlink.cfg]
transport select hla_swd

# Never touch NRST.
reset_config none

# The ST-Link floors SWD at ~1 MHz regardless; 1000 is reliable here.
adapter speed 1000

# Accept the GD32/APM32 clone DAP id instead of ST's.
set CPUTAPID 0x2ba01477

source [find target/stm32f1x.cfg]
